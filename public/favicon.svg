<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background with deep forest emerald gradient -->
  <rect width="512" height="512" rx="128" fill="#0f2e24"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#70e29b" stroke-opacity="0.35" stroke-width="8"/>
  
  <!-- Outer glowing sunburst rings -->
  <circle cx="256" cy="256" r="180" stroke="#70e29b" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" stroke="#70e29b" stroke-opacity="0.4" stroke-width="3"/>
  
  <!-- Stylized Sun & Compass Star -->
  <g transform="translate(256, 256)">
    <!-- 8-Pointed Luxury Expedition Compass Star -->
    <!-- North Point (Accent Gold-Mint) -->
    <path d="M 0 0 L -24 -40 L 0 -190 L 24 -40 Z" fill="#70e29b"/>
    <path d="M 0 0 L 0 -190 L 24 -40 Z" fill="#58cc84"/>
    
    <!-- South Point -->
    <path d="M 0 0 L 24 40 L 0 190 L -24 40 Z" fill="#70e29b" fill-opacity="0.85"/>
    <path d="M 0 0 L 0 190 L -24 40 Z" fill="#3ea866"/>

    <!-- East Point -->
    <path d="M 0 0 L 40 -24 L 190 0 L 40 24 Z" fill="#70e29b" fill-opacity="0.9"/>
    <path d="M 0 0 L 190 0 L 40 24 Z" fill="#58cc84"/>

    <!-- West Point -->
    <path d="M 0 0 L -40 24 L -190 0 L -40 -24 Z" fill="#70e29b" fill-opacity="0.9"/>
    <path d="M 0 0 L -190 0 L -40 -24 Z" fill="#3ea866"/>

    <!-- Diagonal Secondary Points -->
    <path d="M 0 0 L -10 -25 L -105 -105 L -25 -10 Z" fill="#a3f5c2" fill-opacity="0.6"/>
    <path d="M 0 0 L 25 -10 L 105 -105 L 10 -25 Z" fill="#a3f5c2" fill-opacity="0.6"/>
    <path d="M 0 0 L 10 25 L 105 105 L 25 10 Z" fill="#a3f5c2" fill-opacity="0.6"/>
    <path d="M 0 0 L -25 10 L -105 105 L -10 25 Z" fill="#a3f5c2" fill-opacity="0.6"/>

    <!-- Center Core Gem / Mountain Horizon -->
    <circle cx="0" cy="0" r="38" fill="#0a2118" stroke="#70e29b" stroke-width="6"/>
    <circle cx="0" cy="0" r="20" fill="#70e29b"/>
    <circle cx="0" cy="0" r="8" fill="#0f2e24"/>
  </g>
</svg>
